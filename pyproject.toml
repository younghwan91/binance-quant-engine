[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binance-quant-engine"
version = "0.1.2"
description = "Strategy-agnostic Binance USDT-M futures backtest & execution engine — no-look-ahead, backtest/live parity, optional MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "quant", "quantitative-trading", "backtest", "backtesting", "trading",
    "binance", "binance-futures", "crypto", "cryptocurrency", "futures",
    "algo-trading", "algorithmic-trading", "trading-bot", "execution", "mcp",
    "model-context-protocol",
]
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Live execution talks to Binance USDT-M Futures; not needed for backtests.
live = ["python-binance>=1.0.29"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "python-binance>=1.0.29", "mcp>=1.0"]

[project.scripts]
bqe-backtest = "binance_quant_engine.backtest.vectorized:main"
binance-quant-engine-mcp = "binance_quant_engine.mcp.server:main"

[project.urls]
Homepage = "https://github.com/younghwan91/binance-quant-engine"
Repository = "https://github.com/younghwan91/binance-quant-engine"
Documentation = "https://github.com/younghwan91/binance-quant-engine/blob/main/docs/USAGE.md"
"Bug Tracker" = "https://github.com/younghwan91/binance-quant-engine/issues"
Changelog = "https://github.com/younghwan91/binance-quant-engine/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_quant_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 룰셋을 명시한다 — ruff 기본 선택은 릴리스마다 넓어지므로, 그대로 두면 코드를 건드리지
# 않아도 CI가 갑자기 빨개진다(0.16에서 실제 발생). dev extra의 ruff 핀과 한 쌍이다.
select = ["E4", "E7", "E9", "F"]
